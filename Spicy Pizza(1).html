document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-size: 22px; font-weight: 700; min-width: 34px; text-align: center;\">{{ detailQty }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ detailPlus }}\" style=\"border: 1.5px solid #E3D9CB; background: #FFFDFA; cursor: pointer; width: 42px; height: 42px; border-radius: 11px; font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 600;\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size: 11px; color: #9C948D; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; margin-bottom: 8px;\">Note for kitchen<\u002Fdiv>\n          <input value=\"{{ detailNote }}\" sc-camel-on-change=\"{{ onNoteChange }}\" placeholder=\"e.g. cut in 8, extra spicy\" style=\"width: 100%; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; padding: 13px 14px; border-radius: 11px; border: 1.5px solid #E3D9CB; background: #FBF6EE; outline: none; color: #241F1C;\">\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px;\">\n            <sc-for list=\"{{ detailTags }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ g.onClick }}\" style=\"cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 999px; border: 1.5px solid {{ g.border }}; background: {{ g.bg }}; color: {{ g.fg }};\">{{ g.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 10px;\">\n            <button sc-camel-on-click=\"{{ closeDetail }}\" style=\"cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; padding: 16px 22px; border-radius: 12px; background: #FFFDFA; border: 1.5px solid #E3D9CB; color: #241F1C;\">Cancel<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ detailConfirm }}\" style=\"flex: 1; border: 0; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; padding: 16px; border-radius: 12px; background: #C4212A; color: #fff;\">Add to order · {{ detailTotalText }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ voidOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(28,25,23,.55); display: grid; place-items: center; padding: 24px;\">\n      <div style=\"background: #FFFDFA; border-radius: 20px; padding: 28px; width: 100%; max-width: 460px; box-shadow: 0 30px 70px -30px rgba(40,25,15,.7); animation: riseIn .18s ease both;\">\n        <div style=\"font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700;\">Void {{ voidName }}?<\u002Fdiv>\n        <div style=\"color: #7C736C; font-size: 14px; margin-top: 6px;\">A reason is required — it shows on the owner's report.<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 20px;\">\n          <sc-for list=\"{{ voidReasons }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 11px 15px; border-radius: 999px; border: 1.5px solid {{ r.border }}; background: {{ r.bg }}; color: {{ r.fg }};\">{{ r.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px;\">\n          <button sc-camel-on-click=\"{{ closeVoid }}\" style=\"flex: 1; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; padding: 15px; border-radius: 12px; background: #FFFDFA; border: 1.5px solid #E3D9CB; color: #241F1C;\">Keep item<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmVoid }}\" style=\"flex: 1; border: 0; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; padding: 15px; border-radius: 12px; background: {{ voidBtnBg }}; color: #fff;\">Void item<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;serviceChargePct&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:15,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Billing&quot;}}\">\nconst MENU = [\n  [\"Pizza\", \"Chicken Tikka Pizza (Medium)\", 1150, \"Placeholder \\u2014 sizes S / M / L / Family\"],\n  [\"Pizza\", \"Fajita Sicilian (Large)\", 1650, \"Placeholder \\u2014 recipe being finalised\"],\n  [\"Pizza\", \"Cheese Lover (Small)\", 700, \"Placeholder \\u2014 sizes S / M / L / Family\"],\n  [\"Pizza\", \"Spice Special (Family)\", 2400, \"Placeholder \\u2014 sizes S / M / L / Family\"],\n  [\"Family Deals\", \"Family Deal-01\", 5500, \"2 Medium Pizza, 6 Zinger Burger, 10 Pcs Hot Wings, 3 Large Fries, 1.5 Ltr Drink, 1 Cake\"],\n  [\"Regular Deals\", \"Regular Deal-03\", 550, \"1 Zinger Burger, 1 Reg Drink, 1 Reg Fries\"],\n  [\"Burgers\", \"Zinger Burger\", 380, \"Crispy fillet, lettuce, mayo\"],\n  [\"Burgers\", \"Cheezy Chicken Burger\", 600, \"Double cheese, grilled patty\"],\n  [\"Rolls\", \"Shawarma Roll\", 220, \"Chicken, garlic sauce, pita\"],\n  [\"Chicken\", \"Hot Wings (10pcs)\", 550, \"Tossed in house hot sauce\"],\n  [\"Fries\", \"Loaded Fries\", 600, \"Cheese sauce, jalape\\u00f1o, chicken\"],\n  [\"Platters\", \"Turkish Platter\", 600, \"Rice, chicken, salad, sauce\"],\n  [\"Drinks\", \"1.5 Ltr Drink\", 200, \"Chilled bottle\"],\n  [\"Shakes\", \"Spice Ice Shake (Oreo)\", 450, \"Thick shake, crushed Oreo\"],\n  [\"Shakes\", \"Fresh Shake (Mango)\", 350, \"Seasonal fresh mango\"],\n  [\"Ice Cream\", \"Ice Cream (Chocolate, large)\", 200, \"Large scoop cup\"],\n  [\"Russian Salad\", \"Russian Salad (medium)\", 500, \"Fruit, cream, medium box\"]\n];\nconst CATS = [\"Pizza\", \"Family Deals\", \"Regular Deals\", \"Burgers\", \"Rolls\", \"Chicken\", \"Fries\", \"Platters\", \"Drinks\", \"Shakes\", \"Ice Cream\", \"Russian Salad\"];\nconst SOLD_OUT = { \"Cheese Lover (Small)\": true };\nconst TAGS = [\"Extra spicy\", \"No onion\", \"Extra cheese\", \"Cut in 8\", \"Less salt\"];\nconst SECTIONS = {\n  today: [\"Today\", \"Tuesday, 4 August \\u00b7 open since 12:00 PM\", \"Today\"],\n  reports: [\"Reports\", \"Mon 28 Jul \\u2013 Sun 3 Aug\", \"Reports\"],\n  menu: [\"Menu management\", \"Live items show on the counter screen instantly\", \"Menu\"]\n};\nconst WEEK = [[\"M\", 32], [\"T\", 29], [\"W\", 37], [\"T\", 41], [\"F\", 48], [\"S\", 73], [\"S\", 52]];\nconst TOP = [[\"Chicken Tikka Pizza\", 64], [\"Spice Special (Family)\", 51], [\"Zinger Burger\", 44], [\"Loaded Fries\", 39], [\"1.5 Ltr Drink\", 31]];\nconst RED = \"#C4212A\", GREEN = \"#3F9E5A\", AMBER = \"#E0952B\", INK = \"#241F1C\";\n\nconst slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\");\nconst rs = (n) => \"Rs. \" + n.toLocaleString(\"en-US\");\n\nclass Component extends DCLogic {\n  state = {\n    surface: \"counter\",\n    view: \"tables\",\n    device: \"laptop\",\n    tableId: \"T2\",\n    cat: \"Family Deals\",\n    pay: \"Cash\",\n    voidLine: null,\n    voidReason: null,\n    adminSection: \"today\",\n    hidden: { \"Fajita Sicilian (Large)\": true },\n    formCat: \"Pizza\",\n    formLive: true,\n    detail: null,\n    lastRound: 2,\n    tables: {\n      T1: { name: \"Table 1\", seats: 4, busy: false, mins: 0, rounds: 0, sent: [] },\n      T2: { name: \"Table 2\", seats: 4, busy: true, mins: 42, rounds: 2, sent: [[\"Family Deal-01\", 5500, 1], [\"1.5 Ltr Drink\", 200, 2]] },\n      T3: { name: \"Table 3\", seats: 2, busy: true, mins: 12, rounds: 1, sent: [[\"Zinger Burger\", 380, 2], [\"Loaded Fries\", 600, 1]] },\n      T4: { name: \"Table 4\", seats: 6, busy: false, mins: 0, rounds: 0, sent: [] },\n      T5: { name: \"Table 5\", seats: 4, busy: true, mins: 68, rounds: 3, sent: [[\"Turkish Platter\", 600, 2], [\"Hot Wings (10pcs)\", 550, 1], [\"Fresh Shake (Mango)\", 350, 2]] },\n      T6: { name: \"Table 6\", seats: 2, busy: false, mins: 0, rounds: 0, sent: [] },\n      TA: { name: \"Takeaway\", seats: 0, busy: true, mins: 4, rounds: 1, sent: [[\"Shawarma Roll\", 220, 3], [\"Regular Deal-03\", 550, 1]] }\n    },\n    cart: []\n  };\n\n  t() { return this.state.tables[this.state.tableId]; }\n  sentTotal(t) { return t.sent.reduce((a, l) => a + l[1] * l[2], 0); }\n  cartTotal() { return this.state.cart.reduce((a, l) => a + l.price * l.qty, 0); }\n\n  add = (name, price) => this.setState((s) => {\n    const cart = s.cart.slice();\n    const i = cart.findIndex((l) => l.name === name);\n    if (i >= 0) cart[i] = Object.assign({}, cart[i], { qty: cart[i].qty + 1 });\n    else cart.push({ name, price, qty: 1, mods: name === \"Zinger Burger\" ? [\"Extra spicy\"] : [] });\n    return { cart };\n  });\n  bump = (name, d) => this.setState((s) => ({\n    cart: s.cart.map((l) => (l.name === name ? Object.assign({}, l, { qty: l.qty + d }) : l)).filter((l) => l.qty > 0)\n  }));\n\n  open = (id) => this.setState((s) => {\n    const tables = Object.assign({}, s.tables);\n    tables[id] = Object.assign({}, tables[id], { busy: true });\n    return { tableId: id, view: \"order\", cart: [], tables, cat: s.cat };\n  });\n\n  send = () => this.setState((s) => {\n    if (!s.cart.length) return {};\n    const tables = Object.assign({}, s.tables);\n    const t = tables[s.tableId];\n    const sent = t.sent.slice();\n    s.cart.forEach((l) => {\n      const i = sent.findIndex((x) => x[0] === l.name);\n      if (i >= 0) sent[i] = [sent[i][0], sent[i][1], sent[i][2] + l.qty];\n      else sent.push([l.name, l.price, l.qty]);\n    });\n    tables[s.tableId] = Object.assign({}, t, { sent, busy: true, rounds: t.rounds + 1, mins: t.mins || 1 });\n    return { tables, cart: [], view: \"confirm\", lastRound: t.rounds + 1 };\n  });\n\n  close = () => this.setState((s) => {\n    const tables = Object.assign({}, s.tables);\n    tables[s.tableId] = Object.assign({}, tables[s.tableId], { busy: false, mins: 0, rounds: 0, sent: [] });\n    return { tables, cart: [], view: \"tables\" };\n  });\n\n  renderVals() {\n    const s = this.state;\n    const t = this.t();\n    const d = s.detail;\n    const svcPct = this.props.serviceChargePct ?? 5;\n    const isCounter = s.surface === \"counter\";\n    const order = [\"T1\", \"T2\", \"T3\", \"T4\", \"T5\", \"T6\", \"TA\"];\n    const tables = order.map((id) => {\n      const x = s.tables[id];\n      const total = this.sentTotal(x);\n      const accent = x.busy ? (x.mins > 55 ? AMBER : RED) : GREEN;\n      return {\n        id, name: x.name, short: id === \"TA\" ? \"T-Away\" : \"T\" + id.slice(1), busy: x.busy, accent,\n        seatsText: id === \"TA\" ? \"Counter pickup\" : x.seats + \" seats\",\n        statusText: x.busy ? (x.mins > 55 ? \"Long stay\" : \"Occupied\") : \"Free\",\n        pillBg: x.busy ? (x.mins > 55 ? \"#FDF2E2\" : \"#FBEBEC\") : \"#E9F4EC\",\n        pillFg: x.busy ? (x.mins > 55 ? \"#8A5A12\" : \"#8E1720\") : \"#20603A\",\n        durationText: x.busy ? x.mins + \" min\" : \"\\u2014\",\n        roundsText: x.busy ? String(x.rounds) : \"\\u2014\",\n        totalText: x.busy ? rs(total) : \"\\u2014\",\n        totalColor: x.busy ? INK : \"#B9B0A8\",\n        adminMeta: x.busy ? x.mins + \" min \\u00b7 round \" + x.rounds : \"free\",\n        shortMeta: x.busy ? x.mins + \"m\" : \"free\",\n        primaryLabel: x.busy ? \"Add items\" : \"Start order\",\n        primaryBg: x.busy ? \"#FBEBEC\" : RED,\n        primaryFg: x.busy ? \"#8E1720\" : \"#fff\",\n        onPrimary: () => this.open(id),\n        onBill: () => this.setState({ tableId: id, view: \"bill\" })\n      };\n    });\n    const occupied = order.filter((id) => id !== \"TA\" && s.tables[id].busy).length;\n    const openTotal = order.reduce((a, id) => a + (s.tables[id].busy ? this.sentTotal(s.tables[id]) : 0), 0);\n\n    const counts = {};\n    MENU.forEach((m) => { counts[m[0]] = (counts[m[0]] || 0) + 1; });\n\n    const sentTotal = this.sentTotal(t);\n    const roundTotal = this.cartTotal();\n    const sub = sentTotal + roundTotal;\n    const svc = Math.round(sub * svcPct / 100);\n    const disc = sub > 5000 ? 500 : 0;\n\n    const cartLines = s.cart.map((l) => ({\n      name: l.name, qty: l.qty, priceText: rs(l.price), lineText: rs(l.price * l.qty),\n      hasMods: l.mods.length > 0, modsText: l.mods.join(\" \\u00b7 \"),\n      onPlus: () => this.bump(l.name, 1), onMinus: () => this.bump(l.name, -1),\n      onNote: () => this.setState({ cat: s.cat }), onVoid: () => this.setState({ voidLine: l.name, voidReason: null })\n    }));\n\n    const slipLines = (arr) => arr.map((l) => l[2] + \" x \" + l[0]).join(\"\\n\");\n\n    const payMethods = [\"Cash\", \"Card\", \"Easypaisa\"].map((p) => ({\n      name: p, onClick: () => this.setState({ pay: p }),\n      bg: s.pay === p ? RED : \"transparent\", fg: s.pay === p ? \"#fff\" : \"#D6D3D1\",\n      border: s.pay === p ? RED : \"rgba(255,255,255,.22)\"\n    }));\n\n    const billRounds = [\n      { label: \"Rounds already sent\", lines: t.sent.map((l) => ({ qty: l[2], name: l[0], lineText: rs(l[1] * l[2]), color: INK, strike: \"none\", voidNote: \"\" })) }\n    ];\n    if (s.cart.length) billRounds.push({ label: \"Current round (not yet sent)\", lines: cartLines.map((l) => ({ qty: l.qty, name: l.name, lineText: l.lineText, color: INK, strike: \"none\", voidNote: \"\" })) });\n    billRounds.push({ label: \"Voided\", lines: [{ qty: 1, name: \"Loaded Fries\", lineText: rs(600), color: \"#A39A92\", strike: \"line-through\", voidNote: \"  \\u2014 wrong item, Ahsan K.\" }] });\n\n    const heights = [58, 72, 46, 88, 100, 64, 82];\n    const spark = heights.map((h, i) => ({ h: h + \"%\", bg: i === 6 ? RED : \"rgba(245,239,230,.25)\" }));\n\n    const navA = [[\"Today\", true], [\"Reports\", false], [\"Orders\", false], [\"Menu\", false]].map(([name, on]) => ({\n      name, fg: on ? RED : \"#A39A92\", dot: on ? RED : \"#DED4C6\"\n    }));\n\n    const voidReasons = [\"Wrong item\", \"Customer changed mind\", \"Kitchen out of stock\", \"Billing error\"].map((r) => ({\n      name: r, onClick: () => this.setState({ voidReason: r }),\n      bg: s.voidReason === r ? \"#FBEBEC\" : \"#FFFDFA\", fg: s.voidReason === r ? \"#8E1720\" : \"#5C5450\",\n      border: s.voidReason === r ? RED : \"#E3D9CB\"\n    }));\n\n    return {\n      goCounter: () => this.setState({ surface: \"counter\" }),\n      goAdmin: () => this.setState({ surface: \"admin\" }),\n      goTables: () => this.setState({ view: \"tables\" }),\n      backToMenu: () => this.setState({ view: \"order\" }),\n      openBill: () => this.setState({ view: \"bill\" }),\n      sendKitchen: this.send,\n      closeTable: this.close,\n      startTakeaway: () => this.open(\"TA\"),\n      setLaptop: () => this.setState({ device: \"laptop\" }),\n      setPhone: () => this.setState({ device: \"phone\" }),\n      counterTabBg: isCounter ? \"#F5EFE6\" : \"transparent\",\n      counterTabFg: isCounter ? INK : \"#A8A29E\",\n      adminTabBg: !isCounter ? \"#F5EFE6\" : \"transparent\",\n      adminTabFg: !isCounter ? INK : \"#A8A29E\",\n      laptopBg: s.device === \"laptop\" ? \"#FFFDFA\" : \"transparent\",\n      laptopFg: s.device === \"laptop\" ? INK : \"#8A817A\",\n      phoneBg: s.device === \"phone\" ? \"#FFFDFA\" : \"transparent\",\n      phoneFg: s.device === \"phone\" ? INK : \"#8A817A\",\n      isTables: isCounter && s.view === \"tables\",\n      isOrder: isCounter && s.view === \"order\",\n      isConfirm: isCounter && s.view === \"confirm\",\n      isBill: isCounter && s.view === \"bill\",\n      isAdmin: !isCounter,\n      isAdminLaptop: !isCounter && s.device === \"laptop\",\n      isAdminPhone: !isCounter && s.device === \"phone\",\n      tables, occupiedCount: occupied, openTotalText: rs(openTotal),\n      categories: CATS.map((c) => ({\n        name: c, count: counts[c] || 0, onClick: () => this.setState({ cat: c }),\n        bg: s.cat === c ? RED : \"transparent\", fg: s.cat === c ? \"#fff\" : \"#5C5450\",\n        countFg: s.cat === c ? \"rgba(255,255,255,.7)\" : \"#B9B0A8\"\n      })),\n      activeCat: s.cat,\n      items: MENU.filter((m) => m[0] === s.cat && !s.hidden[m[1]]).map((m) => {\n        const line = s.cart.find((l) => l.name === m[1]);\n        const out = SOLD_OUT[m[1]];\n        return {\n          name: m[1], cat: m[0], desc: m[3], priceText: rs(m[2]),\n          slotId: \"item-\" + slug(m[1]), slotHint: m[0] + \" photo\",\n          inCart: !!line, qty: line ? line.qty : 0, soldOut: !!out, dim: out ? .55 : 1,\n          onOpen: () => { if (!out) this.setState({ detail: { name: m[1], price: m[2], cat: m[0], qty: 1, note: \"\", tags: [] } }); },\n          onAdd: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (!out) this.add(m[1], m[2]); }\n        };\n      }),\n      activeTableName: t.name,\n      activeTableMeta: t.busy ? t.mins + \" min open \\u00b7 \" + t.rounds + \" rounds sent\" : \"New order\",\n      activeTableMetaShort: t.name,\n      roundText: String(t.rounds + 1),\n      sentLines: t.sent.map((l) => ({ qty: l[2], name: l[0], lineText: rs(l[1] * l[2]) })),\n      hasSent: t.sent.length > 0,\n      cart: cartLines, cartEmpty: s.cart.length === 0,\n      sentTotalText: rs(sentTotal), roundTotalText: rs(roundTotal), grandTotalText: rs(sub),\n      sendBg: s.cart.length ? RED : \"#D6C9B8\",\n      sentRoundText: String(s.lastRound),\n      sentJustNowText: \"just now \\u00b7 2 slips printed\",\n      kitchenSlip: t.name + \"\\nRound \" + s.lastRound + \"\\n\" + slipLines(t.sent) + \"\\n-- no prices --\",\n      counterSlip: t.name + \"\\nRound \" + s.lastRound + \"\\n\" + slipLines(t.sent) + \"\\nRunning \" + rs(sentTotal),\n      billMeta: t.rounds + \" rounds \\u00b7 \" + t.mins + \" min \ n      isReportsLaptop: !isCounter && s.device === \"laptop\" && s.adminSection === \"reports\",\n      isMenuLaptop: !isCounter && s.device === \"laptop\" && s.adminSection === \"menu\",\n      week: WEEK.map((w) => ({\n        day: w[0], value: w[1] + \"k\", h: Math.round(w[1] / 78 * 100) + \"%\",\n        bg: w[1] === 73 ? RED : \"#EBDFCE\", labelFg: w[1] === 73 ? RED : \"#9C948D\"\n      })),\n      ranges: [\"Today\", \"This week\", \"This month\", \"Custom\"].map((r) => ({\n        name: r, onClick: () => this.setState({ range: r }),\n        bg: (s.range || \"This week\") === r ? INK : \"#FFFDFA\",\n        fg: (s.range || \"This week\") === r ? \"#F5EFE6\" : \"#5C5450\",\n        border: (s.range || \"This week\") === r ? INK : \"#E3D9CB\"\n      })),\n      topSellers: TOP.map((t2) => ({ name: t2[0], n: t2[1], w: Math.round(t2[1] / 64 * 120) + \"px\" })),\n      menuCountText: MENU.length + \" items \\u00b7 \" + Object.keys(s.hidden).filter((k) => s.hidden[k]).length + \" hidden\",\n      manageItems: MENU.map((m) => {\n        const hid = !!s.hidden[m[1]];\n        const out = !!SOLD_OUT[m[1]];\n        return {\n          name: m[1], cat: m[0], priceText: rs(m[2]), mono: m[0].slice(0, 2).toUpperCase(),\n          pillText: out ? \"Sold out\" : hid ? \"Hidden\" : \"Live\",\n          pillBg: out ? \"#FDF2E2\" : hid ? \"#F1E9DD\" : \"#E9F4EC\",\n          pillFg: out ? \"#8A5A12\" : hid ? \"#8A817A\" : \"#20603A\",\n          onToggle: () => this.setState((st) => ({ hidden: Object.assign({}, st.hidden, { [m[1]]: !st.hidden[m[1]] }) }))\n        };\n      }),\n      formCats: CATS.slice(0, 8).map((c) => ({\n        name: c, onClick: () => this.setState({ formCat: c }),\n        bg: s.formCat === c ? \"#FBEBEC\" : \"#FFFDFA\", fg: s.formCat === c ? \"#8E1720\" : \"#5C5450\",\n        border: s.formCat === c ? RED : \"#E3D9CB\"\n      })),\n      toggleFormLive: () => this.setState((st) => ({ formLive: !st.formLive })),\n      formLiveBg: s.formLive ? GREEN :
