<script>
        // Simple script to handle toggle visuals for demonstration
        document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const card = e.target.closest('.bg-surface-container-lowest');
                const statusBadge = card.querySelector('.bg-status-free, .bg-status-occupied');
                const statusText = statusBadge.nextElementSibling;
                const image = card.querySelector('.bg-cover');

                if (e.target.checked) {
                    statusBadge.className = 'w-2 h-2 rounded-full bg-status-free';
                    statusText.textContent = 'Available';
                    card.classList.remove('opacity-75');
                    if(image) image.classList.remove('grayscale-[30%]');
                } else {
                    statusBadge.className = 'w-2 h-2 rounded-full bg-status-occupied';
                    statusText.textContent = 'Sold Out';
                    card.classList.add('opacity-75');
                    if(image) image.classList.add('grayscale-[30%]');
                }
            });
        });
    </script>
